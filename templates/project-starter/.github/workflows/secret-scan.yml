name: secret-scan
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Pinned to a reviewed commit of trufflesecurity/trufflehog. Review before bumping.
      - uses: trufflesecurity/trufflehog@9529cc6177f50ed15e29cb886547749627e5f96e
        with:
          extra_args: --results=verified,unknown
