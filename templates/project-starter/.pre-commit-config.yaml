# Requires: pip install pre-commit, and TruffleHog installed (https://github.com/trufflesecurity/trufflehog)
repos:
  - repo: local
    hooks:
      - id: trufflehog
        name: TruffleHog secret scan
        entry: bash -c 'trufflehog git file://. --since-commit HEAD --results=verified,unknown --fail --no-update --trust-local-git-config'
        language: system
        stages: ["pre-commit", "pre-push"]
        pass_filenames: false
